<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#EEEEEE">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>バーチャル店舗｜宮古南</title>
<style>
  /* スタッフページと同じ色（地 #F6F5F1・黒・CRの黄色）。配置は TERRAS のバーチャル店舗と同じ：左＝やり残し・チェック・スタッフ／中央＝店内／右＝売上・お客様／下＝賄い・予約・今月 */
  :root{color-scheme:light;--bg:#F6F5F1;--card:#fff;--ink:#111;--ink2:#333;--muted:#666;--line:#E6E8E6;--sun:#FFB400;--sun-ink:#8A5A00;--sun-soft:#FFF3D1;
        --ok:#1E8E62;--ok-soft:#DDF3E9;--bad:#B23A2A;--bad-soft:#F8E6E3;--warn:#8A5A00;--sky:#2C7CC4;--sky-soft:#E3F0FB;--coral:#D9572B}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink2);font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;-webkit-text-size-adjust:100%}
  .top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top) + 12px) 18px 0}
  .top h1{font-size:18px;margin:0;color:var(--ink);font-weight:900}
  .top .sub{font-size:12.5px;color:var(--muted)}
  .top .home{margin-left:auto;padding:6px 13px;border:1px solid #C1CCCB;background:#fff;color:#000;text-decoration:none;font-size:13px;font-weight:700}
  .grid{display:grid;gap:12px;padding:12px 18px calc(env(safe-area-inset-bottom) + 18px);
        grid-template-columns:minmax(250px,1fr) minmax(420px,2.1fr) minmax(250px,1fr);
        grid-template-areas:"left stage right" "bottom bottom bottom"}
  .col{display:flex;flex-direction:column;gap:12px;min-width:0}
  .left{grid-area:left}.right{grid-area:right}
  .bottom{grid-area:bottom;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .stage{grid-area:stage;position:relative;min-height:460px;overflow:hidden;background:#e9e2d4;border:1px solid var(--line)}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block}
  #pins{position:absolute;inset:0;pointer-events:none}
  .pin{position:absolute;left:0;top:0;will-change:transform}
  .pin>span{display:inline-flex;align-items:center;gap:4px;transform:translate(-50%,-100%);background:#fff;border:2px solid var(--c,#999);color:#111;padding:1px 7px;font-size:11.5px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.15);white-space:nowrap}
  .pin.staff>span{background:#000;border-color:#000;color:#fff;font-weight:600;font-size:11px}
  .pin.area>span{background:#fff;border-color:#000}
  .pin.alert>span{border-color:var(--bad);animation:pulse 1.3s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(178,58,42,.5)}50%{box-shadow:0 0 0 6px rgba(178,58,42,0)}}
  .legend{position:absolute;left:10px;bottom:8px;display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:#444;background:rgba(255,255,255,.85);padding:4px 8px}
  .legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
  .card{background:var(--card);padding:12px 14px;min-width:0}
  .card h2{font-size:14px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px;color:var(--ink);font-weight:900}
  .card h2 .en{font-family:"Poppins","Helvetica Neue",Arial,sans-serif;font-size:10px;font-weight:600;letter-spacing:.16em;color:var(--sun-ink);text-transform:uppercase}
  .card h2 .r{margin-left:auto;font-weight:500;font-size:11.5px;color:var(--muted)}
  .card.alert{box-shadow:inset 0 0 0 2px var(--bad)}
  .yen{font-family:"Poppins","Helvetica Neue",Arial,sans-serif;font-size:30px;font-weight:600;color:var(--ink);line-height:1.15;font-variant-numeric:tabular-nums}
  .mut{color:var(--muted);font-size:12.5px}
  .bar{height:8px;background:var(--line);overflow:hidden;margin:5px 0 2px}
  .bar i{display:block;height:100%;background:var(--sun)}
  .kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:6px}
  .kv b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .al{font-size:13px;padding:7px 9px;margin-top:6px;border-left:4px solid var(--line);background:#fafaf8;line-height:1.5}
  .al:first-child{margin-top:0}
  .al.bad{border-color:var(--bad);background:var(--bad-soft);color:#5c241d}
  .al.warn{border-color:var(--sun);background:var(--sun-soft);color:#5a3d00}
  .al.ok{border-color:var(--ok);background:var(--ok-soft);color:#17543c}
  .rows{list-style:none;margin:0;padding:0;font-size:13px}
  .rows li{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line)}
  .rows li:first-child{border-top:0}
  .rows .tm{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
  .ck{flex:0 0 16px;text-align:center;font-weight:800}
  .ck.y{color:var(--ok)}.ck.n{color:var(--bad)}.ck.w{color:var(--muted)}
  .badge{font-size:10.5px;padding:0 7px;background:var(--ok-soft);color:#17543c;font-weight:700;white-space:nowrap}
  .badge.off{background:#eee;color:#666}.badge.warn{background:var(--sun-soft);color:#5a3d00}.badge.bad{background:var(--bad-soft);color:#5c241d}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
  .nums div{background:#f7f5ef;padding:7px 2px}
  .nums b{display:block;font-size:19px;color:var(--ink);font-family:"Poppins","Helvetica Neue",Arial,sans-serif;font-weight:600}
  .nums span{font-size:11px;color:var(--muted)}
  .stars{color:var(--sun);letter-spacing:1px;font-size:13px}
  .stars.low{color:var(--bad)}
  .pscore{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px}
  .pscore div{display:grid;grid-template-columns:1fr auto;align-items:baseline;font-size:12.5px}
  .pscore b{font-family:"Poppins","Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:16px;color:var(--ink)}
  .pscore b.lo{color:var(--bad)}
  .pscore i{grid-column:1 / -1;height:4px;background:var(--line);display:block;overflow:hidden}
  .pscore em{display:block;height:100%;background:var(--sun)}
  .src{font-size:11px;color:var(--muted);padding:0 18px 14px;line-height:1.7}
  /* AIに質問（鍵があるときだけ出る。右下のボタン → 小さなチャット欄） */
  .ask-btn{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:40;background:#000;color:#fff;border:0;border-bottom:4px solid var(--sun);padding:11px 16px 8px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .ask-btn:focus-visible,.ask input:focus-visible,.ask button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
  .ask{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:41;width:min(380px,calc(100vw - 24px));height:min(540px,calc(100dvh - 24px));display:flex;flex-direction:column;background:#fff;border:2px solid #000;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .ask[hidden],.ask-btn[hidden]{display:none}
  body.has-ask .src{padding-bottom:calc(env(safe-area-inset-bottom) + 70px)}
  .ask-head{display:flex;align-items:center;gap:8px;background:#000;color:#fff;padding:8px 8px 8px 12px;font-size:14px;font-weight:800}
  .ask-head .en{font-family:"Poppins","Helvetica Neue",Arial,sans-serif;font-size:10px;font-weight:600;letter-spacing:.16em;color:var(--sun)}
  .ask-head button{margin-left:auto;background:none;border:0;color:#fff;font:inherit;font-size:13px;padding:6px 8px;cursor:pointer}
  .ask-log{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);overscroll-behavior:contain}
  .ask-log .hint{font-size:12.5px;color:var(--muted);line-height:1.7}
  .ask-log .m{max-width:88%;padding:7px 10px;font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
  .ask-log .m.q{align-self:flex-end;background:#000;color:#fff}
  .ask-log .m.a{align-self:flex-start;background:#fff;color:var(--ink);border-left:4px solid var(--sun)}
  .ask-log .m.wait{color:var(--muted)}
  .ask-log .m.err{border-left-color:var(--bad);background:var(--bad-soft);color:#5c241d}
  .ask-form{flex:0 0 auto;display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);background:#fff}
  .ask-form input{flex:1 1 auto;min-width:0;font:inherit;font-size:16px;padding:9px 10px;border:1px solid #999;border-radius:0;background:#fff;color:var(--ink)}
  .ask-form button{flex:0 0 auto;font:inherit;font-size:14px;font-weight:800;padding:0 14px;border:0;background:var(--sun);color:#000;cursor:pointer}
  .ask-form button:disabled{background:#ddd;color:#888;cursor:default}
  @media (max-width:1100px){
    .grid{grid-template-columns:1fr 1fr;grid-template-areas:"stage stage" "left right" "bottom bottom"}
    .bottom{grid-template-columns:1fr 1fr}
    .stage{min-height:56vw}
  }
  @media (max-width:640px){
    .grid{grid-template-columns:1fr;grid-template-areas:"stage" "left" "right" "bottom";padding:10px 12px 16px}
    .bottom{grid-template-columns:1fr}
    .stage{min-height:104vw}
    .top{padding-left:12px;padding-right:12px}
    .pin>span{font-size:10px;padding:0 5px}
    .src{padding:0 12px 14px}
  }
</style>
</head>
<body>
<div class="top">
  <h1>徹頭徹尾 宮古南店　バーチャル店舗</h1>
  <span class="sub" id="sub">読み込んでいます…</span>
  <a class="home" href="./" id="homeLink">‹ スタッフページ</a>
</div>
<div class="grid">
  <div class="col left">
    <section class="card" id="c-alerts"><h2>やり残し・気づき<span class="en">To do</span><span class="r" id="al-count"></span></h2><div id="alerts"><div class="mut">読み込んでいます…</div></div></section>
    <section class="card" id="c-routine"><h2>ルーティンチェック<span class="en">Routine</span><span class="r" id="rt-count"></span></h2><ul class="rows" id="routine"><li class="mut">—</li></ul></section>
    <section class="card"><h2>今日のスタッフ<span class="en">Staff</span><span class="r" id="st-count"></span></h2><ul class="rows" id="staff"><li class="mut">—</li></ul></section>
  </div>

  <div class="stage" aria-label="徹頭徹尾 宮古南店の店内">
    <canvas id="scene"></canvas>
    <div id="pins" aria-hidden="true"></div>
    <div class="legend"><span><i style="background:#000"></i>スタッフ（出勤中）</span></div>
  </div>

  <div class="col right">
    <section class="card" id="c-sales"><h2>今日の売上<span class="en">Sales</span><span class="r">dinii・税抜</span></h2><div id="sales" class="mut">—</div></section>
    <section class="card"><h2>今日の口コミ<span class="en">Reviews</span><span class="r" id="rv-count"></span></h2><ul class="rows" id="reviews"><li class="mut">—</li></ul></section>
  </div>

  <div class="bottom">
    <section class="card" id="c-pulse"><h2>パルスの声<span class="en">Staff voice</span><span class="r" id="pl-count"></span></h2><div id="pulse" class="mut">—</div></section>
    <section class="card" id="c-makanai"><h2>賄いチェック<span class="en">Staff meal</span><span class="r" id="mk-count"></span></h2><ul class="rows" id="makanai"><li class="mut">—</li></ul></section>
    <section class="card"><h2>今月の売上<span class="en">This month</span><span class="r" id="mo-note"></span></h2><div id="month" class="mut">—</div></section>
  </div>
</div>
<div class="src" id="src"></div>

<script type="module">
import * as THREE from './three.module.js';

/* GAS「CR 定時処理」のウェブアプリ（ルーティンチェックと同じ）。このページは鍵なしで開ける（2026/11/19 岸田さんの指示）。
   鍵（#k=）があるときだけ、スタッフページへ戻るリンクと「今月の目標」と「AIに質問」に使う */
const API = 'https://script.google.com/macros/s/AKfycbwUIszTlRW20wetQ6KWe-MOoSWiqkJmg6SzsDgK_tmiQ0oi76U0EYqH50UyTTkkMto/exec';
const REFRESH_MS = 60000;
const STALE_MIN = 50;            // 取り込みがこれより古ければ「データが古い」と出す
const DEMO = /[?&]demo=1/.test(location.search);

/* 卓の配置：TableCheck のフロア図（2026/11/19 時点の位置・席数・種類）。変えたら TableCheck の値で直す */
const TABLES = [
  ['A-1', 210, 300, 55, 35, 2, 'counter', 'L'], ['A-2', 210, 370, 55, 35, 2, 'counter', 'L'],
  ['A-3', 250, 460, 55, 35, 2, 'counter', 'B'], ['A-4', 310, 460, 55, 35, 2, 'counter', 'B'], ['A-5', 370, 460, 55, 35, 2, 'counter', 'B'],
  ['A-6', 410, 400, 55, 35, 2, 'counter', 'R'], ['A-7', 410, 330, 55, 35, 2, 'counter', 'R'], ['A-8', 410, 260, 55, 35, 2, 'counter', 'R'],
  ['B1', 50, 390, 70, 70, 4, 'open'], ['B2', 50, 460, 70, 70, 4, 'open'], ['B3', 50, 530, 70, 70, 4, 'open'],
  ['B4', 520, 430, 80, 50, 6, 'tatami'], ['B5', 520, 350, 80, 50, 6, 'tatami'], ['B6', 520, 270, 80, 50, 6, 'tatami'],
  ['C1', 40, 150, 70, 70, 6, 'private'], ['C2', 40, 250, 70, 70, 6, 'private']
].map(([name, l, t, w, h, cap, type, side]) => ({ name, cap, type, side, x: (l + w / 2 - 320) / 45, z: (t + h / 2 - 375) / 45 }));
const ROUTINES = [
  ['hall_open', 'ホール 開店', 'open'], ['kitchen_open', 'キッチン 開店', 'open'],
  ['manager_kintai', '店長 勤怠チェック', 'kintai'],
  ['hall_close', 'ホール 閉店', 'close'], ['kitchen_close', 'キッチン 閉店', 'close']
];

/* ---------- 小さな道具 ---------- */
const $ = (id) => document.getElementById(id);
const yen = (n) => '¥' + Math.round(Number(n) || 0).toLocaleString('ja-JP');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nowJst = () => new Date(Date.now() + (new Date().getTimezoneOffset() + 540) * 60000);
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const mins = (t) => { const m = String(t || '').match(/(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };
/* 営業日の中の「分」：朝5時より前は前日の続き（24時〜）として数える */
const bizMin = (t) => { const m = mins(t); return m == null ? null : (m < 300 ? m + 1440 : m); };
const hmOf = (m) => { m = ((m % 1440) + 1440) % 1440; return Math.floor(m / 60) + ':' + pad(m % 60); };
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

/* 鍵 */
let key = (location.hash.match(/k=([A-Za-z0-9_-]+)/) || [])[1] || '';
if (key) store.set('miyakoKey', key); else key = store.get('miyakoKey') || '';
if (key) $('homeLink').href = './#k=' + key;

/* ---------- 3D：店内（カメラは止めたまま） ---------- */
const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#e9e2d4');
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight('#fff6e6', '#9c8f7c', 1.15));
const sun = new THREE.DirectionalLight('#fff0d8', 1.5); sun.position.set(-6, 14, 8); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10 }); scene.add(sun);
const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, ...o });
function box(w, h, d, color, x, y, z, o) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, o)); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m; }
function cyl(r, h, color, x, y, z) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 20), mat(color)); m.position.set(x, y, z); m.castShadow = true; scene.add(m); return m; }
function label(text, w, h, x, y, z, rotX = -Math.PI / 2) {
  const c = document.createElement('canvas'); c.width = 512; c.height = Math.round(512 * h / w); const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0)'; g.fillRect(0, 0, c.width, c.height); g.fillStyle = 'rgba(60,50,40,.55)'; g.font = '700 ' + Math.round(c.height * 0.6) + 'px "Hiragino Sans","Noto Sans JP",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, c.width / 2, c.height / 2);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true })); m.rotation.x = rotX; m.position.set(x, y, z); scene.add(m); return m;
}
/* 床・壁 */
box(15.4, 0.1, 12.6, '#d8cdb8', 0, -0.05, 0.1);
box(15.4, 1.5, 0.15, '#3a322b', 0, 0.75, -6.2); box(0.15, 1.5, 12.6, '#3a322b', -7.7, 0.75, 0.1); box(0.15, 1.5, 12.6, '#3a322b', 7.7, 0.75, 0.1);
/* キッチン（奥） */
box(8.5, 0.95, 1.1, '#9aa2a6', 1.2, 0.47, -5.4, { roughness: 0.4, metalness: 0.4 }); box(8.5, 0.12, 1.3, '#5a6064', 1.2, 1.0, -5.4);
box(3.2, 0.5, 0.9, '#42484c', 2.6, 2.0, -5.5); label('キッチン', 3.2, 0.7, 1.2, 0.02, -4.3);
/* カウンター（コの字）と肉場 */
const WOOD = '#4a3626', WOOD2 = '#6b4d35';
box(0.7, 1.0, 3.4, WOOD, -1.15, 0.5, -0.5); box(0.7, 1.0, 5.2, WOOD, 1.95, 0.5, -0.6); box(3.8, 1.0, 0.7, WOOD, 0.4, 0.5, 1.65);
box(1.6, 0.9, 1.6, '#8d9498', 0.4, 0.45, -0.4, { roughness: 0.4, metalness: 0.3 }); label('肉場', 1.5, 0.55, 0.4, 0.92, -0.4);
/* 座敷（右）・個室（左奥）・入口とレジ（手前） */
box(2.6, 0.25, 5.6, '#b9a877', 5.35, 0.12, 0.0); label('座敷', 1.6, 0.55, 5.35, 0.27, 3.1);
box(0.1, 1.5, 4.6, '#5b4a3a', -3.9, 0.75, -3.2); box(3.7, 1.5, 0.1, '#5b4a3a', -5.8, 0.75, -0.9); box(3.7, 1.2, 0.08, '#7a6753', -5.8, 0.6, -3.1); label('個室', 1.6, 0.55, -6.6, 0.02, -5.3);
box(1.6, 1.0, 0.7, WOOD2, 3.6, 0.5, 5.3); box(0.5, 0.35, 0.4, '#222', 3.6, 1.18, 5.3); label('入口', 1.6, 0.55, 0.4, 0.02, 5.6); box(2.2, 0.06, 0.5, '#8b2f1c', 0.4, 0.03, 6.1);

/* 卓 */
const TB = {};
TABLES.forEach((t) => {
  const o = { ...t, guests: [], state: 'free' }; TB[t.name] = o;
  if (t.type === 'counter') {
    const dx = t.side === 'L' ? -0.55 : t.side === 'R' ? 0.55 : 0, dz = t.side === 'B' ? 0.55 : 0;
    const cx = t.side === 'L' ? -1.15 : t.side === 'R' ? 1.95 : t.x, cz = t.side === 'B' ? 1.65 : t.z;
    o.grill = cyl(0.17, 0.06, '#222', cx, 1.03, cz);
    o.seats = [[cx + dx * 1.25 - (t.side === 'B' ? 0.28 : 0), cz + dz * 1.25 - (t.side === 'B' ? 0 : 0.28)], [cx + dx * 1.25 + (t.side === 'B' ? 0.28 : 0), cz + dz * 1.25 + (t.side === 'B' ? 0 : 0.28)]];
    o.seats.forEach((s) => cyl(0.16, 0.5, '#2b2b2b', s[0], 0.25, s[1]));

  const active = on > 0 || (nm >= 600 && nm <= 1440);

  $('src').innerHTML = 'データの元と、読んだ時刻：' + parts.map(([k, name]) => name + ' ' + esc(atHm(D[k]))).join('／') + esc(reviewsAt) + '／ルーティンチェックは今の状態。お客様の名前や連絡先は、この画面には出しません。';

  /* ---- やり残し ---- */
  PIN.reg.sp.textContent = 'レジ ' + (sl ? yen(sl.total) : '');
  const list2 = alerts.length ? alerts : [['ok', '今のところ、やり残しはありません']];
  $('alerts').innerHTML = list2.map((a) => '<div class="al ' + a[0] + '">' + esc(a[1]) + '</div>').join('');
  const cnt = alerts.filter((a) => a[0] === 'bad' || a[0] === 'warn').length;
  $('al-count').textContent = cnt ? cnt + '件' : '';
  $('c-alerts').classList.toggle('alert', alerts.some((a) => a[0] === 'bad'));
}

/* ---------- AIに質問（鍵があるときだけ。ページ → 会社GAS → Claude。APIキーはここには無い） ----------
   送るもの：鍵の SHA-256（16進）・質問・直近3往復。やりとりはこの画面の中だけに持つ（端末にも残さない） */
if (key && window.crypto && crypto.subtle) {
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const btn = el('button', 'ask-btn', 'AIに質問'); btn.type = 'button';
  const box = el('section', 'ask'); box.hidden = true; box.setAttribute('aria-label', 'AIに質問');
  const head = el('div', 'ask-head'); head.append(el('span', '', 'AIに質問'), el('span', 'en', 'ASK'));
  const close = el('button', '', '閉じる'); close.type = 'button'; head.append(close);
  const log = el('div', 'ask-log'); log.setAttribute('aria-live', 'polite');
  log.append(el('div', 'hint', '今日の打刻・売上・賄い・口コミ・パルス・ルーティンチェックのことを聞けます。例：「いま出勤しているのは誰？」「今日の売上は目安に届きそう？」'));
  const form = el('form', 'ask-form');
  const input = el('input'); input.type = 'text'; input.maxLength = 500; input.placeholder = '質問を入力'; input.autocomplete = 'off'; input.enterKeyHint = 'send'; input.setAttribute('aria-label', '質問');
  const send = el('button', '', '送信'); send.type = 'submit';
  form.append(input, send); box.append(head, log, form); document.body.append(btn, box); document.body.classList.add('has-ask');

  const pairs = [];   // [[質問, 答え], …] うまく答えが返った分だけ
  let busy = false, khP = null;
  const kh = () => khP || (khP = crypto.subtle.digest('SHA-256', new TextEncoder().encode(key)).then((b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('')));
  const add = (cls, text) => { const m = el('div', 'm ' + cls, text); log.append(m); log.scrollTop = log.scrollHeight; return m; };
  const open = (on) => { box.hidden = !on; btn.hidden = on; if (on) { fit(); input.focus(); } else btn.focus(); };
  /* スマホでキーボードが出ても入力欄が隠れないよう、見えている範囲に合わせる */
  const vv = window.visualViewport;
  const fit = () => {
    if (!vv || box.hidden) return;
    const under = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    box.style.bottom = under > 0 ? (under + 8) + 'px' : '';
    box.style.height = under > 0 ? Math.min(540, vv.height - 16) + 'px' : '';
    log.scrollTop = log.scrollHeight;
  };
  if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); }
  btn.addEventListener('click', () => open(true));
  close.addEventListener('click', () => open(false));
  box.addEventListener('keydown', (e) => { if (e.key === 'Escape') open(false); });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = input.value.trim().slice(0, 500);
    if (!q || busy) return;
    busy = true; send.disabled = true; input.value = '';
    add('q', q);
    const w = add('a wait', '考えています…');
    try {
      let j;
      if (DEMO) { await new Promise((r) => setTimeout(r, 600)); j = { ok: true, a: '（見本）ここに AI の答えが出ます。見本の画面では、実際には質問を送りません。' }; }
      else {
        j = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'storeAsk', kh: await kh(), q, hist: pairs.slice(-3) }) }).then((r) => r.json());
      }
      if (j && j.ok && j.a) { w.className = 'm a'; w.textContent = j.a; if (!j.prep && !j.limit) pairs.push([q, j.a]); }
      else {
        w.className = 'm a err';
        w.textContent = j && j.error === 'not allowed' ? 'この端末の鍵では、AIに質問できません。スタッフページのQRから開き直してください。' : 'うまく答えられませんでした。少し待って、もう一度送ってください。' + (j && j.error ? '（' + String(j.error).slice(0, 40) + '）' : '');
      }
    } catch (err) {
      w.className = 'm a err'; w.textContent = '通信できませんでした。電波を確かめて、もう一度送ってください。';
    }
    log.scrollTop = log.scrollHeight;
    busy = false; send.disabled = false; input.focus();
  });
}

try { const c = JSON.parse(store.get('miyakoStore') || 'null'); if (!DEMO && c && Date.now() - c.at < 6 * 3600e3) { D = c.d; cached = true; render(); } } catch (e) {}
load(); loadApp(); setInterval(load, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
